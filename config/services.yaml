services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Public so the (firewall-protected) backend module can fetch them from the container.
    Heimseiten\ContaoBackupBundle\BackupDownloader:
        public: true
        arguments:
            $backupManager: '@contao.doctrine.backup_manager'
            $connection: '@database_connection'
            $projectDir: '%kernel.project_dir%'
            $logger: '@monolog.logger.contao'
            $requestStack: '@request_stack'

    Heimseiten\ContaoBackupBundle\RestoreArchiveStore:
        public: true
        arguments:
            $projectDir: '%kernel.project_dir%'

    # Makes the retention of automatic database backups configurable in the back end.
    Heimseiten\ContaoBackupBundle\ConfigurableRetentionPolicy:
        public: true
        decorates: contao.doctrine.backup.retention_policy
        arguments:
            $inner: '@.inner'
            $projectDir: '%kernel.project_dir%'

    Heimseiten\ContaoBackupBundle\AutomaticBackup:
        public: true
        arguments:
            $downloader: '@Heimseiten\ContaoBackupBundle\BackupDownloader'
            $projectDir: '%kernel.project_dir%'
            $logger: '@monolog.logger.contao'

    # The cron job itself needs no public flag - Contao resolves it through the attribute.
    Heimseiten\ContaoBackupBundle\AutomaticBackupCron:
        arguments:
            $automaticBackup: '@Heimseiten\ContaoBackupBundle\AutomaticBackup'

    Heimseiten\ContaoBackupBundle\BackupRestorer:
        public: true
        arguments:
            $backupManager: '@contao.doctrine.backup_manager'
            $backupsStorage: '@contao.filesystem.virtual.backups'
            $connection: '@database_connection'
            $store: '@Heimseiten\ContaoBackupBundle\RestoreArchiveStore'
            $dbafsManager: '@contao.filesystem.dbafs_manager'
            $kernel: '@kernel'
            $projectDir: '%kernel.project_dir%'
            $logger: '@monolog.logger.contao'

    # Lets the setup of a new installation (contao-setup) run without a database, so that the
    # Contao Manager can ask for the access afterwards. The migration catches up on what was skipped.
    Heimseiten\ContaoBackupBundle\EventListener\SymlinksWithoutDatabaseListener:
        arguments:
            $connection: '@database_connection'
            $projectDir: '%kernel.project_dir%'

    Heimseiten\ContaoBackupBundle\Migration\CompleteSymlinksMigration:
        arguments:
            $connection: '@database_connection'
            $kernel: '@kernel'
            $projectDir: '%kernel.project_dir%'
            $webDir: '%contao.web_dir%'
